  <style>
    body { margin: 0; background: #F5F6F8; font-family: "Funnel Sans", "Helvetica Neue", Arial, sans-serif; color: #0A0A0C; -webkit-font-smoothing: antialiased; }

    .mono { font-family: "Martian Mono", ui-monospace, Menlo, monospace; font-variation-settings: "wdth" 85; }
    h1, p { margin: 0; text-wrap: pretty; }
    @keyframes maskUp { from { transform: translateY(105%); } to { transform: none; } }
    @keyframes wipeUp { from { clip-path: inset(100% 0 0 0); } to { clip-path: inset(0 0 0 0); } }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    .line { display: block; overflow: hidden; padding-bottom: 0.04em; }
    .line > span { display: block; animation: maskUp 1s cubic-bezier(.7,0,.2,1) both; }
    .l2 > span { animation-delay: .12s; }
    .panel { animation: wipeUp 1s cubic-bezier(.7,0,.2,1) .5s both; }
    .f { animation: fade .8s ease-out 1.1s both; }
    @media (prefers-reduced-motion: reduce) { .line > span, .panel, .f { animation: none; } }
  </style>
</helmet>
